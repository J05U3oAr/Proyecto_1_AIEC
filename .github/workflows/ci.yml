name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Frontend and SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run build:sdk

  python-checks:
    name: Backend, contracts and MCP
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 1s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      - run: make check
      - name: Offline agent evaluations (no credentials or provider requests)
        run: uv run --frozen python ../evals/run_evals.py --repetitions 3 --output ../docs/evidence/m3/evals-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m34-offline-evaluations
          path: docs/evidence/m3/evals-ci.*
      - name: Offline scale check with two cache clients
        run: uv run --frozen python -m movies.benchmark --requests 40 --concurrency 8
        env:
          PYTHONPATH: .:../mcp
          CATALOG_TEST_REDIS_URL: redis://localhost:16379/14

  container-checks:
    name: Service images and readiness
    runs-on: ubuntu-latest
    env:
      MCP_TOKEN: synthetic-ci-token-not-a-secret
      TMDB_READ_TOKEN: synthetic-ci-token-not-a-provider-credential
      GOOGLE_BOOKS_API_KEY: synthetic-ci-books-not-a-provider-credential
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local services (no provider calls)
        run: docker compose --env-file .env.example -p sofia-ci -f infra/compose.yaml up --build -d --wait
      - name: Check health and authentication
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent http://127.0.0.1:8001/health/ready
          curl --fail --silent http://127.0.0.1:8002/health/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:8001/mcp)" = 401
      - name: Stop test services
        if: always()
        run: docker compose --env-file .env.example -p sofia-ci -f infra/compose.yaml down

  service-delivery:
    name: Package backend and MCP services
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SERVICE_CD_ENABLED == 'true'
    needs: [quality-checks, python-checks, container-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOFIA_IMAGE_TAG: ${{ github.sha }}
      MCP_TOKEN: synthetic-ci-token-not-a-secret
      TMDB_READ_TOKEN: synthetic-ci-token-not-a-provider-credential
      GOOGLE_BOOKS_API_KEY: synthetic-ci-books-not-a-provider-credential
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build versioned images
        run: |
          for service in backend movies books; do
            docker build --file "infra/docker/${service}.Dockerfile" \
              --tag "sofia-${service}:${SOFIA_IMAGE_TAG}" .
          done
      - name: Check readiness using the packaged images
        run: |
          docker compose --env-file .env.example -p sofia-delivery-ci \
            -f infra/compose.yaml -f infra/compose.delivery.yaml up --no-build -d --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
      - name: Export images and Compose configuration
        run: |
          set -o pipefail
          mkdir delivery
          docker image save \
            "sofia-backend:${SOFIA_IMAGE_TAG}" \
            "sofia-movies:${SOFIA_IMAGE_TAG}" \
            "sofia-books:${SOFIA_IMAGE_TAG}" | gzip -1 > delivery/images.tar.gz
          cp infra/compose.yaml infra/compose.delivery.yaml delivery/
          cd delivery
          printf '%s\n' "$SOFIA_IMAGE_TAG" > revision.txt
          sha256sum images.tar.gz compose.yaml compose.delivery.yaml revision.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sofia-services-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: delivery/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Stop delivery smoke-test services
        if: always()
        run: |
          docker compose --env-file .env.example -p sofia-delivery-ci \
            -f infra/compose.yaml -f infra/compose.delivery.yaml down

  pages-build:
    name: Package frontend for GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_CD_ENABLED == 'true'
    needs: [quality-checks, python-checks, container-checks]
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate public backend endpoint
        env:
          VITE_CHAT_ENDPOINT: ${{ vars.VITE_CHAT_ENDPOINT }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = URL.parse(process.env.VITE_CHAT_ENDPOINT ?? '');
          if (
            !endpoint ||
            endpoint.protocol !== 'https:' ||
            endpoint.username || endpoint.password ||
            endpoint.search || endpoint.hash ||
            endpoint.pathname !== '/api/chat' ||
            !endpoint.hostname.includes('.') ||
            endpoint.hostname.endsWith('.localhost') ||
            endpoint.hostname === '127.0.0.1'
          ) {
            console.error('VITE_CHAT_ENDPOINT must point to the public HTTPS /api/chat endpoint without credentials.');
            process.exit(1);
          }
          NODE
      - run: npm ci
      - name: Build frontend for the Pages base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_CHAT_ENDPOINT: ${{ vars.VITE_CHAT_ENDPOINT }}
          VITE_CHAT_MODE: real
        run: npm run build -- --base="${PAGES_BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pages-deploy:
    name: Deploy frontend to GitHub Pages
    needs: pages-build
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the artifact is from the current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "::error::This run is outdated. Deploy from the current main."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
