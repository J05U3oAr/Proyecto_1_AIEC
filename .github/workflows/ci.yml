name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Lint, Test Coverage & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Run Test Suite with Coverage (Threshold >= 80%)
        run: npm run test:coverage

      - name: Typecheck and Build Production Bundle
        run: npm run build
