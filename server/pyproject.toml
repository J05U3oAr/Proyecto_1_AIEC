[project]
name = "sofia-server"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "redis>=5.2,<7",
  "mcp>=1.20,<2",
  "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-jsonschema>=4.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "../mcp", "../mcp/tests", "../evals"]
testpaths = ["tests", "../mcp/tests", "../evals/tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["sofia", "scripts", "../mcp/movies", "../mcp/books", "../mcp/catalog_common", "../evals"]
# Tests are still discovered and linted; every production eval module is measured.
omit = ["../evals/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sofia", "scripts", "../mcp/movies", "../mcp/books", "../mcp/catalog_common", "../evals/sofia_evals", "../evals/agent_provider.py", "../evals/run_evals.py"]
mypy_path = [".", "../mcp", "../evals"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["sofia", "movies", "books", "catalog_common", "sofia_evals"]
known-third-party = ["mcp"]
