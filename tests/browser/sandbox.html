<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Prueba de bloqueo de pestañas</title>
  </head>
  <body>
    <h1>Host de prueba con popups bloqueados por sandbox</h1>
    <iframe
      title="Widget sin permiso para popups"
      src="/"
      sandbox="allow-scripts allow-same-origin allow-forms"
      width="1200"
      height="900"
    ></iframe>
  </body>
</html>
